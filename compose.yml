version: "3.8"

services:
  pebissoa:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/pebiss.db
      - UPLOADS_DIR=/app/uploads
      # ---- NextAuth (changez NEXTAUTH_SECRET en production !) ----
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changez-moi-secret-aleatoire}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      # ---- Admin créé au premier démarrage ----
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@pebiss.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123456}
      - ADMIN_NAME=${ADMIN_NAME:-Administrateur Pebiss}
    volumes:
      # PERSISTENT STORAGE - survive container rebuilds
      - pebissoa-data:/app/data       # Base SQLite
    restart: unless-stopped

volumes:
  pebissoa-data:
